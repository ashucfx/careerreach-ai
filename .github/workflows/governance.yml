name: Repository governance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository hygiene
        run: python scripts/repository_hygiene.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9

  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: careerreach_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careerreach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CAREERREACH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerreach_test
      CAREERREACH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerreach_test
      CAREERREACH_AUTH_SIGNING_KEY: 00000000000000000000000000000000-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Apply database migrations
        run: uv run python -m careerreach.migrations
      - name: Test
        run: uv run pytest -q
