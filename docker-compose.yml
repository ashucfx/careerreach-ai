services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerreach}
      POSTGRES_USER: ${POSTGRES_USER:-careerreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    command: ["python", "-m", "careerreach.migrations"]
    environment:
      CAREERREACH_DATABASE_URL: postgresql://${CAREERREACH_RUNTIME_DATABASE_USER:-careerreach_runtime}:${CAREERREACH_RUNTIME_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-careerreach}
      CAREERREACH_MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-careerreach}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-careerreach}
      CAREERREACH_RUNTIME_DATABASE_USER: ${CAREERREACH_RUNTIME_DATABASE_USER:-careerreach_runtime}
      CAREERREACH_RUNTIME_DATABASE_PASSWORD: ${CAREERREACH_RUNTIME_DATABASE_PASSWORD:?Set CAREERREACH_RUNTIME_DATABASE_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      CAREERREACH_DATABASE_URL: postgresql://${CAREERREACH_RUNTIME_DATABASE_USER:-careerreach_runtime}:${CAREERREACH_RUNTIME_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-careerreach}
      CAREERREACH_ENVIRONMENT: ${CAREERREACH_ENVIRONMENT:-}
      CAREERREACH_MODEL_BASE_URL: ${CAREERREACH_MODEL_BASE_URL:-}
      CAREERREACH_MODEL_API_KEY: ${CAREERREACH_MODEL_API_KEY:-}
      CAREERREACH_REASONING_MODEL: ${CAREERREACH_REASONING_MODEL:-}
      CAREERREACH_COMMUNICATION_MODEL: ${CAREERREACH_COMMUNICATION_MODEL:-}
      CAREERREACH_EXTRACTION_MODEL: ${CAREERREACH_EXTRACTION_MODEL:-}
      CAREERREACH_MODEL_FALLBACK: ${CAREERREACH_MODEL_FALLBACK:-}
      CAREERREACH_BRAVE_SEARCH_API_KEY: ${CAREERREACH_BRAVE_SEARCH_API_KEY:-}
      CAREERREACH_MODEL_TIMEOUT_SECONDS: ${CAREERREACH_MODEL_TIMEOUT_SECONDS:-}
      CAREERREACH_MODEL_MAX_RETRIES: ${CAREERREACH_MODEL_MAX_RETRIES:-}
      CAREERREACH_AUTH_SIGNING_KEY: ${CAREERREACH_AUTH_SIGNING_KEY:-}
      CAREERREACH_AUTH_TOKEN_TTL_MINUTES: ${CAREERREACH_AUTH_TOKEN_TTL_MINUTES:-}
      CAREERREACH_AUTH_ISSUER: ${CAREERREACH_AUTH_ISSUER:-}
      CAREERREACH_AUTH_AUDIENCE: ${CAREERREACH_AUTH_AUDIENCE:-}
      CAREERREACH_TEMPORAL_ADDRESS: temporal:7233
      CAREERREACH_TEMPORAL_NAMESPACE: ${CAREERREACH_TEMPORAL_NAMESPACE:-}
      CAREERREACH_TEMPORAL_TASK_QUEUE: ${CAREERREACH_TEMPORAL_TASK_QUEUE:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "careerreach.worker"]
    environment:
      CAREERREACH_DATABASE_URL: postgresql://${CAREERREACH_RUNTIME_DATABASE_USER:-careerreach_runtime}:${CAREERREACH_RUNTIME_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-careerreach}
      CAREERREACH_ENVIRONMENT: ${CAREERREACH_ENVIRONMENT:-}
      CAREERREACH_MODEL_BASE_URL: ${CAREERREACH_MODEL_BASE_URL:-}
      CAREERREACH_MODEL_API_KEY: ${CAREERREACH_MODEL_API_KEY:-}
      CAREERREACH_REASONING_MODEL: ${CAREERREACH_REASONING_MODEL:-}
      CAREERREACH_COMMUNICATION_MODEL: ${CAREERREACH_COMMUNICATION_MODEL:-}
      CAREERREACH_EXTRACTION_MODEL: ${CAREERREACH_EXTRACTION_MODEL:-}
      CAREERREACH_MODEL_FALLBACK: ${CAREERREACH_MODEL_FALLBACK:-}
      CAREERREACH_MODEL_TIMEOUT_SECONDS: ${CAREERREACH_MODEL_TIMEOUT_SECONDS:-}
      CAREERREACH_MODEL_MAX_RETRIES: ${CAREERREACH_MODEL_MAX_RETRIES:-}
      CAREERREACH_TEMPORAL_ADDRESS: temporal:7233
      CAREERREACH_TEMPORAL_NAMESPACE: ${CAREERREACH_TEMPORAL_NAMESPACE:-}
      CAREERREACH_TEMPORAL_TASK_QUEUE: ${CAREERREACH_TEMPORAL_TASK_QUEUE:-}
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
