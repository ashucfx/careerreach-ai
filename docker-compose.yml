services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerreach}
      POSTGRES_USER: ${POSTGRES_USER:-careerreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/temporal:1.10.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    env_file:
      - .env
    environment:
      CAREERREACH_DATABASE_URL: postgresql://${POSTGRES_USER:-careerreach}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-careerreach}
      CAREERREACH_TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "careerreach.worker"]
    env_file:
      - .env
    environment:
      CAREERREACH_DATABASE_URL: postgresql://${POSTGRES_USER:-careerreach}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-careerreach}
      CAREERREACH_TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

volumes:
  postgres_data:
