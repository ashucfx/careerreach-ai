[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "careerreach-api"
version = "0.1.0"
description = "Agent runtime and API for CareerReach AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=1.8,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "email-validator>=2.2,<3",
  "PyJWT>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pwdlib[argon2]>=0.2,<1",
  "temporalio>=1.36,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pyright>=1.1.408,<2",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/careerreach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["apps/api/careerreach"]
reportMissingTypeStubs = "none"
